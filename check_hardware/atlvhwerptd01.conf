# ---------------------------------------------------------------------------
# atlvhwerptd01.conf - production configuration for check_hardware on
#                      atlvhwerptd01.amd.com (service account z1_vbu_hwe_user)
# ---------------------------------------------------------------------------
#
# Only the settings that actually differ from the built-in defaults are here.
# Everything else is deliberately left to the script, so this file stays small
# enough to audit at a glance. check_hardware.conf.example documents the full
# set of knobs.
#
# NO LITERAL PATHS. check_hardware.sh derives BASE_DIR from its own location
# before sourcing this file, so every path below follows the tree if it is
# ever moved or renamed. The sibling inventory_script project learned this the
# expensive way: a conf that hardcoded its base broke the moment the directory
# was relocated, and the breakage was silent.
# ---------------------------------------------------------------------------

# --- PATH -------------------------------------------------------------------
# jq is NOT in the default PATH on this host - it lives in pandora. Neither
# cron nor systemd sources .bash_profile, and the script sets its own PATH for
# scheduling determinism, so without this line a scheduled run dies with
# "missing required command(s): jq" even though an interactive shell finds it.
#
# EXTRA_PATH is APPENDED to that hardened PATH, never prepended. This directory
# also contains date, curl, grep, sed, awk, cut, sort, python3, openssl and
# xargs at different GNU versions from the system copies. Prepending would swap
# the entire toolchain underneath a script written against the system one -
# with the age filter, which leans on `date`, the most exposed. jq is the only
# thing genuinely missing, and appending is enough to supply it.
EXTRA_PATH="/tool/pandora64/bin"

# --- DNS --------------------------------------------------------------------
# MUST stay empty here. This host's resolv.conf carries "search amd.com", so
# bare service-processor names resolve on their own. Setting a suffix would
# produce names like "atlhwe-lsf24-sp.amd.com.amd.com". It is only ever set in
# a sandbox whose resolver has no matching search domain.
HOST_SUFFIX=""

# --- credentials ------------------------------------------------------------
# Names the ENCRYPTED file explicitly. Either spelling works - load_creds()
# prefers "${CREDS_FILE}.enc" when it exists, and pointing straight at the .enc
# is also accepted - but naming it outright means the configured path stays
# valid once the plaintext is deleted, and makes it obvious at a glance which
# file a run reads. Verified by negative control: with the plaintext moved
# away entirely, a 3-host sweep produced byte-identical findings.
#
# The file is bound by direct RSA to this host's ~/.ssh/id_rsa and can only be
# decrypted here. After editing the credentials, re-encrypt on the host:
#
#   ./bin/ssh_crypt.sh encrypt -k ~/.ssh/id_rsa -p ~/.ssh/id_rsa.pub \
#       -o ./creds/ilo_creds.enc ./creds/ilo_creds
#
# A run logs which file it used and whether it was encrypted, so the run log
# answers that question after the fact.
CREDS_FILE="${BASE_DIR}/creds/ilo_creds.enc"

# --- parallelism and pacing -------------------------------------------------
# 24 workers matches the inventory_script collector on this same fleet.
JOBS=24

# One dark service processor must not hold a worker slot for an entire
# credential walk. 120s comfortably covers a slow-but-healthy SP: a warm
# credmap host completes in ~4s, a cold one in ~54s worst case.
HOST_TIMEOUT=120

# Pacing between credential attempts. DO NOT LOWER THIS. After a few
# rejections an iLO returns 401 to EVERY login for a window - including the
# correct one - so a sweep that retries too fast reports valid credentials as
# rejected. The effective delay is max(this, the SP's published
# LoginFailureDelay), so a stricter SP still wins.
ILO_AUTH_RETRY_DELAY=15

# --- learned credential map -------------------------------------------------
# Stores the winning credential LABEL per service processor, never a password.
# This is what turns a 54s cold probe into a ~4s warm one on a mixed fleet.
USE_CREDMAP=1
CREDMAP_DIR="${BASE_DIR}/tmp/credmap"

# --- hostlist regeneration --------------------------------------------------
# The sweep regenerates hostlist/ from LSF before enumerating it, the same way
# run_inventory.sh's stage 1 does. Left frozen, the spine drifts out of step
# with the fleet: hosts added since it was last written are never checked, and
# decommissioned ones report unreachable forever. It also keeps this project
# and the inventory collector reading the SAME fleet, which is what makes their
# agreement on readable/unreadable counts worth anything.
#
# --no-generate on the command line skips it.
#
# ---------------------------------------------------------------------------
# NOTE ON THE "${VAR:-...}" FORM USED THROUGHOUT THIS SECTION.
# Most settings in this file are plain assignments, because the command line is
# parsed again AFTER the conf is sourced and so still wins. These five have no
# command-line flag, so a plain assignment here would make the conf the only
# place they could be changed - and this file is deployed from git, meaning an
# edit on the host is reverted by the next sync. The ":-" form leaves an
# environment override as the escape hatch for a one-off run:
#     MIN_HOST_PERCENT=0 check_hardware.sh --conf atlvhwerptd01.conf ...
# ---------------------------------------------------------------------------
DO_GENERATE="${DO_GENERATE:-1}"

# Sourced so lshosts/bhosts can be verified present BEFORE anything is
# generated. This matters more than it sounds: do_lsf_generate_hostlist exits 0
# having written EMPTY host lists when LSF is unreachable, so without this
# check a bad LSF morning would silently replace a good 1626-host spine with
# nothing. On this host lshosts/bhosts are NOT on a non-interactive SSH PATH;
# this profile is what puts them there.
LSF_PROFILE="${LSF_PROFILE:-/tool/pandora/etc/lsf/profile.lsf}"

# The datacenters a complete generation must produce. Each needs both a
# <dc>.hosts and a <dc>.host-sps, the latter because a host missing from it is
# reported NO_SP_ENTRY rather than swept.
EXPECTED_DCS="${EXPECTED_DCS:-atl caco dfdc pldc sadc syco}"

# Plausibility floors the staged hostlist must clear before it is promoted over
# the live one. Current fleet is 1626 (atl 620, caco 51, dfdc 315, pldc 339,
# sadc 139, syco 162), so 80% is ~1300 - comfortably below normal churn and far
# above a partial LSF answer. MIN_HOST_PERCENT=0 disables the comparison, which
# is what to reach for if the fleet genuinely shrinks.
MIN_HOSTS="${MIN_HOSTS:-100}"
MIN_HOST_PERCENT="${MIN_HOST_PERCENT:-80}"

# --- output -----------------------------------------------------------------
# Two distinct destinations, and the distinction matters.
#
# REPORTS_DIR is local scratch: every run writes findings.csv, exceptions.csv
# and summary.txt into reports/<run-tag>/ here, and they stay for history.
REPORTS_DIR="${BASE_DIR}/reports"
TMP_DIR="${BASE_DIR}/tmp"

# --- run tag and transcript -------------------------------------------------
# An unnamed run tags itself ${RUN_TAG_PREFIX}<timestamp>, e.g.
# prod-20261018-191106, and writes its transcript to
# ${LOG_DIR}/<run-tag>.log with ${LOG_DIR}/latest.log pointing at the newest.
#
# This is what lets a scheduled job be nothing more than
#     check_hardware.sh --conf atlvhwerptd01.conf --fresh
# with no wrapper computing a timestamp, exporting it and redirecting output.
#
# RUN_TAG itself is deliberately NOT set here, and must not be. A fixed tag
# would be reused on every run, and re-using a tag RESUMES from the per-host
# cache - which has no age check - so a nightly job would re-publish the first
# night's findings forever while appearing to work perfectly.
RUN_TAG_PREFIX="prod-"
LOG_DIR="${BASE_DIR}/tmp/logs"

# --- retention --------------------------------------------------------------
# Prune LOCAL run artefacts older than this: reports/<tag>/, tmp/fleet/<tag>/
# and tmp/logs/<tag>.log. Matches inventory_script's RETENTION_DAYS=90.
# A nightly run leaves ~8 MB of per-host cache plus a small report and log, so
# 90 days is roughly 750 MB, nearly all of it cache. Set 0 to keep everything.
#
# NOTHING under OUTPUT_DIR is ever pruned. Mind the naming trap between the two
# projects: here OUTPUT_DIR IS the published share, whereas in inventory_script
# OUTPUT_DIR is local and the share is PUBLISH_DIR. The dated CSVs on
# /proj/emu_share are left entirely alone, and removing them is a manual act.
RETENTION_DAYS="90"

# OUTPUT_DIR is the PUBLISH destination on the shared filesystem, where
# dashboards and other tools look. The finished findings CSV is copied here as
#     vbu_hardware_errors_YYYY-MM-DD.csv
# only after the run has completed and written its summary.
#
# The copy goes to a dot-prefixed temporary name in this same directory and is
# then renamed into place. rename(2) inside one filesystem is atomic, so a
# reader polling this directory sees either the previous day's file or the
# complete new one - never a half-written CSV. A plain cp would not give that
# guarantee, because cp writes incrementally and the destination is readable
# the whole time.
#
# Pass --no-publish for a run whose results should stay local.
OUTPUT_DIR="/proj/emu_share/tools/check_hardware"

# Published files are world-readable within the group, matching the sibling
# vbu_inventory files (-rw-rw-r--). The collector's own umask would otherwise
# leave them 600 and invisible to anything else.
PUBLISH_MODE="664"

# Publish the exceptions file alongside the findings. Off by default because
# it adds a second file to a shared directory. Worth turning on if whatever
# consumes the findings needs to distinguish "this host is healthy" from
# "this host never answered" - findings.csv alone cannot tell them apart.
#PUBLISH_EXCEPTIONS=1

# The exceptions file publishes under its OWN prefix, not as a suffix on
# PUBLISH_PREFIX. It carries a different schema (6 columns, not 21), so if it
# shared the findings prefix then a consumer globbing vbu_hardware_errors_*.csv
# would pick it up and try to parse it as findings. That failure is quiet -
# the file is complete and well-formed, just the wrong shape - which makes it
# worse than the partial-read problem the atomic rename exists to prevent.
#PUBLISH_EXCEPTIONS_PREFIX="vbu_hardware_exceptions"

# --- what counts as a finding -----------------------------------------------
# Critical only, hardware and power categories only. Both defaults, written out
# explicitly because they are the two decisions most likely to be questioned:
#
#   INCLUDE_WARNINGS=0  - add --warnings for a broader sweep.
#   ALL_CATEGORIES=0    - the firmware marks things like "Factory Root CA is
#                         about to expire" Critical with Categories=Security,
#                         which is a real alert but not a failed part.
INCLUDE_WARNINGS=0
ALL_CATEGORIES=0

# No default age cutoff. An unrepaired uncorrectable memory error matters
# whether it happened last night or last year; age is reported in the
# FirstSeen / LastSeen / AgeDays columns instead of being filtered on.
